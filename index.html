<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">🎓 STUDENT FINANCE</p>
        <h1>Expense Tracker</h1>
        <p>Track your money. Enjoy student life!</p>
      </div>
      <div class="logo">₹</div>
    </header>

    <section class="summary">
      <article class="card purple">
        <p>💰 Total Spent</p>
        <h2 id="totalSpent">₹0.00</h2>
      </article>
      <article class="card green">
        <p>🧾 Transactions</p>
        <h2 id="expenseCount">0</h2>
      </article>
      <article class="card orange">
        <p>🔥 Highest Expense</p>
        <h2 id="highestExpense">₹0.00</h2>
      </article>
    </section>

    <section class="panel">
      <h2>✨ Add New Expense</h2>

      <form id="expenseForm">
        <div class="form-grid">
          <label>
            Expense Name
            <input id="title" type="text"
              placeholder="e.g. College lunch"
              maxlength="80" required>
          </label>

          <label>
            Amount (₹)
            <input id="amount" type="number"
              placeholder="e.g. 150"
              min="0.01" max="100000000"
              step="0.01" required>
          </label>

          <label>
            Category
            <select id="category">
              <option>Food</option>
              <option>Travel</option>
              <option>Education</option>
              <option>Shopping</option>
              <option>Entertainment</option>
              <option>Other</option>
            </select>
          </label>

          <label>
            Date
            <input id="date" type="date" required>
          </label>
        </div>

        <button class="add-button" type="submit">
          + Add Expense
        </button>
      </form>
    </section>

    <section class="panel">
      <div class="list-header">
        <h2>📊 Expense History</h2>

        <label class="filter">
          Filter:
          <select id="filterCategory">
            <option value="All">All Categories</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Education</option>
            <option>Shopping</option>
            <option>Entertainment</option>
            <option>Other</option>
          </select>
        </label>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expenseList"></tbody>
        </table>
      </div>

      <p id="emptyMessage">
        No expenses yet. Add your first expense! 🎉
      </p>
    </section>

    <footer>Made with ❤️ by a CSE student</footer>
  </main>
</body>
</html>
